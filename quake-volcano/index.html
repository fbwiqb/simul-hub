<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>지구가 흔들리는 곳</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="app-header">
    <h1>지구가 흔들리는 곳</h1>
    <span id="last-updated" aria-live="polite">데이터 준비 중</span>
  </header>
  <aside id="sidebar" aria-label="지도 조절 패널">
    <div class="panel-section">
      <div class="panel-title">레이어</div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>
  </aside>
  <main id="map" aria-label="세계 지진과 화산 지도"></main>
  <div id="timeline-control" aria-label="시간 애니메이션"></div>
  <div id="legend" aria-label="판 경계 종류 범례"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
